<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juniperium - Source Explorer</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Page Specific Theme Styles (Teal & Teto Ruby Gradient) */
    body {
      background: linear-gradient(135deg, teal, #9b111e);
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      color: #ffffff;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-bottom: 10px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    p.subtitle {
      color: #ffcccc;
      margin-bottom: 30px;
      font-size: 1.1rem;
    }

    /* Navigation / Back link */
    .back-link {
      display: inline-block;
      color: #7afcff;
      text-decoration: none;
      margin-bottom: 20px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #ffffff;
      text-shadow: 0 0 8px #7afcff;
    }

    /* Gethub Explorer Container Styles */
    .gethub-explorer {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 700px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .gethub-search-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 20px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .gethub-search-input:focus {
      border-color: #7afcff;
      box-shadow: 0 0 8px rgba(122, 252, 255, 0.3);
    }

    .gethub-file-list {
      max-height: 400px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    /* Scrollbar styling for a cleaner look */
    .gethub-file-list::-webkit-scrollbar {
      width: 6px;
    }
    .gethub-file-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .gethub-file-item {
      display: block;
      color: #ffcccc;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-family: monospace;
      font-size: 0.95rem;
      border: 1px solid transparent;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .gethub-file-item:hover {
      background: rgba(155, 17, 30, 0.4);
      border-color: rgba(155, 17, 30, 0.6);
      color: #ffffff;
    }

    .gethub-empty {
      color: #bbb;
      text-align: center;
      font-style: italic;
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-link">&larr; Back to Home</a>
  
  <h1>Juniperium Sources</h1>
  <p class="subtitle">Search, explore, and download raw source files straight from the repository.</p>

  <!-- This is where gethub will inject the search input and file explorer -->
  <div id="juniperium-explorer"></div>

  <!-- Load your gethub library -->
  <script src="gethub.js"></script>
  <script>
    // Initialize gethub explorer for Juniperium
    const gh = new Gethub({
      owner: 'GDDASH45', // Replace with your actual GitHub username
      repo: 'Juniperium'
    });

    gh.initExplorer({
      target: '#juniperium-explorer',
      branch: 'main' // Change to 'master' if your main branch is named master
    });
  </script>
</body>
</html>
